appId: com.mrp.fe3hreference
---
# Verifies the Phase 4 deliverable:
# App launches -> character grid populated from FE3H data -> tapping a
# character navigates to Character Detail with the correct id -> Item
# Search remains reachable from the top bar menu.
- launchApp
- assertVisible: "FE3H Reference"
- assertVisible: "Hubert"
- tapOn: "Hubert"
- assertVisible: "ID: hubert"
- back
- assertVisible: "Hubert"
- tapOn: "⋮"
- tapOn: "Item Search"
- assertVisible: "Item Search"
